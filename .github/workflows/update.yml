name: CS16 Live Status

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  query:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - run: python3 query.py

      - run: |
          git config user.name "cs16-status-bot"
          git config user.email "actions@users.noreply.github.com"
          git add status.json
          git diff --cached --quiet || git commit -m "Update CS 1.6 status"
          git push
